# @package _global_
# IsaacSim owner for the headless Python 3.12 IsaacLab/PhysX subprocess.
# The owner keeps all policy-defining fields inherited from the MuJoCo base
# unchanged so a checkpoint has the same observation/action contract.  Playback
# replays physics snapshots through the offline MuJoCo renderer.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: isaacsim
  play_render_mode: auto
algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
env:
  # IsaacSim 6 / IsaacLab 3 run in a dedicated Python 3.12 worker.
  isaacsim_device_id: 0
  isaacsim_worker_timeout_s: 120.0
  events:
    pd_gains: null
play_profile:
  enabled: false
